name: Build RAM Booster APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Preparar Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Extrair projeto
        run: unzip RAMBooster_A30_GitHub.zip -d extracted

      - name: Ajustar Android Gradle Plugin
        run: sed -i 's/8.9.1/8.10.1/g' extracted/RAMBooster_A30/build.gradle.kts

      - name: Compilar APK
        run: gradle -p extracted/RAMBooster_A30 assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: RAM-Booster-APK
          path: extracted/RAMBooster_A30/app/build/outputs/apk/debug/app-debug.apk
